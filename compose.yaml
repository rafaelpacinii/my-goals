name: my-goals

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-goals}
      POSTGRES_USER: ${DB_USER:-goals}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?use --env-file .env.example ou configure .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    build:
      context: ./infra/keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?use --env-file .env.example ou configure .env}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak-db:/opt/keycloak/data/h2
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3;
          read -r -t 3 line <&3;
          [[ "$$line" == HTTP/*" 200 "* ]]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s

  storage:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?use --env-file .env.example ou configure .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?use --env-file .env.example ou configure .env}
      S3_BUCKET: ${S3_BUCKET:-goals-log-attachments}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsSI --aws-sigv4 aws:amz:us-east-1:s3
          --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY"
          "http://127.0.0.1:8333/$$S3_BUCKET" >/dev/null
      interval: 5s
      timeout: 4s
      retries: 20

  api:
    build:
      context: ./goals-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-goals}
      DB_USER: ${DB_USER:-goals}
      DB_PASSWORD: ${DB_PASSWORD:?use --env-file .env.example ou configure .env}
      KEYCLOAK_URL: http://keycloak:8080/realms/goals
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/goals
      OIDC_AUDIENCE: goals-api
      KEYCLOAK_BASE_URL: http://keycloak:8080
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-8333}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?use --env-file .env.example ou configure .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?use --env-file .env.example ou configure .env}
      S3_BUCKET: ${S3_BUCKET:-goals-log-attachments}
      S3_PATH_STYLE: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./goals-web
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  postgres-data:
  keycloak-db:
  storage-data:
