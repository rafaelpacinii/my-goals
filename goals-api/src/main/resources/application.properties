# HTTP e contrato OpenAPI
quarkus.http.port=8080
quarkus.smallrye-openapi.info-title=My Goals API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.open-api-version=3.0.4
quarkus.swagger-ui.always-include=true
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# O Flyway mantém o schema. O Hibernate só o valida.
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.flyway.migrate-at-start=true

# Busca JWKS pela rede interna e valida o emissor anunciado aos clientes.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${KEYCLOAK_URL}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.token.issuer=${OIDC_ISSUER}
quarkus.oidc.token.audience=${OIDC_AUDIENCE:goals-api}
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.rest-client.keycloak-auth.url=${KEYCLOAK_BASE_URL}

# Parâmetros da futura integração de anexos. O host público entra na assinatura.
storage.s3.endpoint=${S3_ENDPOINT}
storage.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT}}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.access-key=${S3_ACCESS_KEY}
storage.s3.secret-key=${S3_SECRET_KEY}
storage.s3.bucket-name=${S3_BUCKET:goals-log-attachments}
storage.s3.path-style=${S3_PATH_STYLE:false}

# Suíte inicial HTTP. Testes de integração deverão usar serviços reais isolados.
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.oidc.tenant-enabled=false
